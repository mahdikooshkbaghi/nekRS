[map]
horizon = 2.0
dt = 0.02
steps = 100
integrator = BDF1-EXT1
history_policy = provider-defined

[continuation]
parameter = Re
first = 35.0
last = 60.0
step = 2.0
parameter_scale = 50.0

[newton]
max_iterations = 12
tolerance = 1e-7
finite_difference_step = 1e-5

[eigensolver]
nev = 6
subspace = 50
residual_tolerance = 1e-5

[event]
bracket_tolerance = 0.1

[metric]
kind = volume-normalized-kinetic-energy

[restart]
schema_version = 1
rank_layout = fixed
